<!DOCTYPE html>
<html>
<head>
    <title>Official Content Page</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #fff; overflow: hidden; height: 100vh; font-family: sans-serif; }
        #alert { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; text-align: center; padding-top: 25vh; color: white; }
        .blue-screen { background: #0078d7; }
        .red-screen { background: #aa0000; }
        
        #cursor { position: fixed; display: none; width: 22px; pointer-events: none; z-index: 10000; }
        
        /* The Desktop Simulation */
        #desktop { display: none; position: absolute; top:0; left:0; width:100%; height:100%; }
        #v-file { position: absolute; top: 50px; left: 50px; width: 80px; transition: all 1s cubic-bezier(0.47, 0, 0.745, 0.715); z-index: 5; }
        #v-bin { position: absolute; bottom: 50px; right: 50px; width: 100px; z-index: 4; }
    </style>
</head>
<body>
    <div style="padding:40px;">
        <h1>Welcome to our portal</h1>
        <p>Loading secure content, please wait...</p>
    </div>
    
    <!-- This part only appears when Admin starts the prank -->
    <div id="desktop">
        <img id="v-file" src="images/file.png" alt="My Files">
        <img id="v-bin" src="images/bin.png" alt="Recycle Bin">
    </div>

    <div id="alert"></div>
    <img id="cursor" src="https://cur.cursors-4u.net/arrow/arrow-1.png">

    <script>
        // CRITICAL: Replace 'YOUR-SERVER-URL' with your actual Render/Railway URL
        const socket = io('https://your-server-name.onrender.com'); 
        
        socket.emit('join', 'viewer');

        const alrt = document.getElementById('alert');
        const dsk = document.getElementById('desktop');
        const cursor = document.getElementById('cursor');
        const fileIcon = document.getElementById('v-file');

        socket.on('exec-prank', (data) => {
            if (data.type === 'red' || data.type === 'windows') {
                alrt.style.display = 'block';
                alrt.className = data.type === 'red' ? 'red-screen' : 'blue-screen';
                alrt.innerHTML = `<h1>${data.type === 'red' ? 'CRITICAL MALWARE DETECTED' : 'Windows Update<br>99% Complete...'}</h1>`;
                socket.emit('viewer-update', { status: data.type });
            } 
            else if (data.type === 'clear') {
                alrt.style.display = 'none';
                socket.emit('viewer-update', { status: 'clear' });
            } 
            else if (data.type === 'set-mouse-state') {
                dsk.style.display = data.active ? 'block' : 'none';
                cursor.style.display = data.active ? 'block' : 'none';
            } 
            else if (data.type === 'delete-files') {
                // Animation logic: Fly to the bin and disappear
                const bin = document.getElementById('v-bin').getBoundingClientRect();
                fileIcon.style.top = (bin.top + 10) + "px";
                fileIcon.style.left = (bin.left + 10) + "px";
                fileIcon.style.transform = "scale(0.1) rotate(45deg)";
                fileIcon.style.opacity = "0";
                
                setTimeout(() => {
                    alert("CRITICAL ERROR: Files have been moved to Recycle Bin.");
                }, 1100);
            }
        });

        socket.on('mouse-sync', (pos) => {
            cursor.style.left = pos.x + 'px';
            cursor.style.top = pos.y + 'px';
        });
    </script>
</body>
</html>
